name: Run Tests Multi-OS

on:
  repository_dispatch:
    types:
      - send_payload_to_pytest

jobs:
  run_tests:
    strategy:
      matrix:
        os: ${{ github.event.client_payload.os_list }}
        python-version: ${{ github.event.client_payload.version_list }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set timezone
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo timedatectl set-timezone Asia/Tokyo ;;
            macOS)   sudo systemsetup -settimezone Asia/Tokyo > /dev/null ;;
            Windows) powershell -NoProfile -Command 'Set-TimeZone -Id "Tokyo Standard Time"' ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          uv sync --locked
          echo "Installed dependencies:"
          uv tree

      - name: Run tests
        run: |
          uv run pytest
